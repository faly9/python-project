#reserver pour la production
version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend

  django-app:
    image: faly9/django:latest   # ✅ Ici on utilise ton image depuis Docker Hub
    container_name: django-app
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql-db    # ✅ Nom du service MySQL dans ce fichier
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - mysql-db
    networks:
      - backend

volumes:
  mysql-data:

networks:
  backend:
